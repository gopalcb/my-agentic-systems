AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Page-view tracking API for the My Agent Systems GitHub Pages site.

Parameters:
  AllowedOrigin:
    Type: String
    Default: https://gopalcb.github.io
  OwnerIps:
    Type: String
    Default: ''
    Description: Comma-separated public IP addresses that should be marked as owner visits.

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 8
    MemorySize: 128

Resources:
  PageViewTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: view_id
          AttributeType: S
        - AttributeName: visit_id
          AttributeType: S
        - AttributeName: event_timestamp
          AttributeType: S
      KeySchema:
        - AttributeName: view_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: VisitIdByTimestamp
          KeySchema:
            - AttributeName: visit_id
              KeyType: HASH
            - AttributeName: event_timestamp
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  PageViewApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - !Ref AllowedOrigin
        AllowMethods:
          - POST
          - OPTIONS
        AllowHeaders:
          - content-type

  PageViewFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: lambda/
      Handler: index.handler
      Environment:
        Variables:
          TABLE_NAME: !Ref PageViewTable
          OWNER_IPS: !Ref OwnerIps
          ALLOWED_ORIGIN: !Ref AllowedOrigin
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PageViewTable
      Events:
        TrackPageView:
          Type: HttpApi
          Properties:
            ApiId: !Ref PageViewApi
            Path: /agent/page-view
            Method: POST

Outputs:
  PageViewEndpoint:
    Description: API Gateway endpoint to paste into public/runtime-config.js.
    Value: !Sub '${PageViewApi.ApiEndpoint}/agent/page-view'
  PageViewTableName:
    Description: DynamoDB table storing page-view records.
    Value: !Ref PageViewTable
